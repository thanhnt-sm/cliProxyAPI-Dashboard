# Manual/Automatic Build and Release workflow for Windows + macOS
name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version for release (e.g., v1.0.0). Leave empty for auto-generated.'
        required: false
        default: ''
      release_name:
        description: 'Release name (optional)'
        required: false
      release_body:
        description: 'Release notes (optional)'
        required: false
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || github.event.inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.24'
  BINARY_NAME: 'cli-proxy-api'

jobs:
  # First job: determine version to use across all jobs
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          # Priority: workflow_call input > workflow_dispatch input > tag ref > auto-generated
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(date -u +%Y.%m.%d-%H%M%S)"
          fi
          
          # Ensure version starts with 'v'
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v${VERSION}"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Using version: $VERSION"

      - name: Ensure tag exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if tag exists locally
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "✅ Tag $VERSION exists locally"
          else
            echo "📌 Creating tag $VERSION..."
            git tag -a "$VERSION" -m "Release $VERSION"
          fi
          
          # Push tag (ignore error if already exists on remote)
          git push origin "$VERSION" 2>/dev/null || echo "ℹ️ Tag may already exist on remote"

  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: .exe
          - goos: windows
            goarch: arm64
            runner: windows-latest
            ext: .exe
          # macOS AMD64 - Intel runner (available until Aug 2027, replaces retired macos-13)
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: ''
          # macOS ARM64 - Apple Silicon runner
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ''
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p build
          OUTFILE="build/${{ env.BINARY_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          COMMIT="${{ github.sha }}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          
          echo "🔨 Building $OUTFILE for GOOS=$GOOS GOARCH=$GOARCH"
          go build -ldflags "-s -w -X 'main.Version=${VERSION}' -X 'main.Commit=${COMMIT:0:7}' -X 'main.BuildDate=${DATE}'" \
            -o "$OUTFILE" ./cmd/server/
          
          echo "✅ Built: $OUTFILE"
          ls -la build/

      - name: Package artifact (Windows)
        if: matrix.goos == 'windows'
        id: package-win
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          $ARTNAME = "${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          
          New-Item -ItemType Directory -Force -Path release-package | Out-Null
          Copy-Item build/* release-package/
          if (Test-Path LICENSE) { Copy-Item LICENSE release-package/ }
          if (Test-Path README.md) { Copy-Item README.md release-package/ }
          if (Test-Path config.example.yaml) { Copy-Item config.example.yaml release-package/ }
          
          Compress-Archive -Path release-package/* -DestinationPath "${ARTNAME}.zip" -Force
          Write-Host "📦 Created: ${ARTNAME}.zip"
          echo "artifact=${ARTNAME}.zip" >> $env:GITHUB_OUTPUT

      - name: Package artifact (macOS)
        if: matrix.goos == 'darwin'
        id: package-mac
        shell: bash
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          ARTNAME="${{ env.BINARY_NAME }}-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          
          mkdir -p release-package
          cp build/* release-package/
          cp LICENSE README.md config.example.yaml release-package/ 2>/dev/null || true
          
          tar -czvf "${ARTNAME}.tar.gz" -C release-package .
          echo "📦 Created: ${ARTNAME}.tar.gz"
          echo "artifact=${ARTNAME}.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload artifact (Windows)
        if: matrix.goos == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-win.outputs.artifact }}
          path: ${{ steps.package-win.outputs.artifact }}
          retention-days: 7

      - name: Upload artifact (macOS)
        if: matrix.goos == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package-mac.outputs.artifact }}
          path: ${{ steps.package-mac.outputs.artifact }}
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare artifacts for release
        id: files
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "📁 Downloaded structure:"
          find artifacts -type f || true
          
          # Move all files to root directory for easier upload
          mkdir -p release-files
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} release-files/ \; || true
          
          echo "📦 Files to upload:"
          ls -la release-files/ || echo "No files found"
          
          # Count files
          FILE_COUNT=$(find release-files -type f 2>/dev/null | wc -l || echo "0")
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT
          
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::warning::No release files found!"
          else
            echo "✅ Found $FILE_COUNT files for release"
          fi

      - name: Create Release
        if: steps.files.outputs.file_count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: Release ${{ needs.prepare.outputs.version }}
          body: |
            ${{ github.event.inputs.release_body || 'Automated release from GitHub Actions' }}
            
            ## 📥 Downloads
            | Platform | Architecture | File |
            |----------|--------------|------|
            | Windows | AMD64 (x64) | `cli-proxy-api-*-windows-amd64.zip` |
            | Windows | ARM64 | `cli-proxy-api-*-windows-arm64.zip` |
            | macOS | AMD64 (Intel) | `cli-proxy-api-*-darwin-amd64.tar.gz` |
            | macOS | ARM64 (Apple Silicon) | `cli-proxy-api-*-darwin-arm64.tar.gz` |
            
            ## 🔧 Installation
            1. Download the appropriate file for your platform
            2. Extract the archive
            3. Run the `cli-proxy-api` executable
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "## 🎉 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files uploaded:** ${{ steps.files.outputs.file_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Download from:** [Releases](https://github.com/${{ github.repository }}/releases/tag/$VERSION)" >> $GITHUB_STEP_SUMMARY
