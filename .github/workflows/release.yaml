# 🚀 Universal Cross-Platform Build & Release Workflow
# 
# ✅ Security Hardened (2025 Best Practices)
# ✅ Auto-detect: Go, Rust, Node.js, Python
# ✅ Output: Windows (.zip), macOS (.tar.gz + .dmg)
# ✅ Architectures: amd64 + arm64

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g., v1.0.0). Empty = auto-generate'
        required: false
        default: ''
      create_dmg:
        description: 'Create macOS DMG installer'
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

# Minimal permissions (least privilege principle)
permissions:
  contents: write
  
concurrency:
  group: release-${{ github.ref_name || github.event.inputs.tag || github.sha }}
  cancel-in-progress: false

env:
  PROJECT_NAME: ''
  MAIN_FILE: ''
  
jobs:
  # ============================================================
  # DETECT: Auto-detect project language and settings
  # ============================================================
  detect:
    name: Detect Project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      language: ${{ steps.detect.outputs.language }}
      project_name: ${{ steps.detect.outputs.project_name }}
      main_file: ${{ steps.detect.outputs.main_file }}
      version: ${{ steps.version.outputs.version }}
      go_version: ${{ steps.detect.outputs.go_version }}
      node_version: ${{ steps.detect.outputs.node_version }}
      python_version: ${{ steps.detect.outputs.python_version }}
    
    steps:
      # Pin to SHA for security (v4.2.2)
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Detect language and settings
        id: detect
        run: |
          if [ -f "go.mod" ]; then
            LANG="go"
            GO_VER=$(grep -E '^go [0-9]+\.[0-9]+' go.mod | awk '{print $2}' || echo "1.24")
            echo "go_version=$GO_VER" >> $GITHUB_OUTPUT
            NAME=$(grep -E '^module ' go.mod | awk '{print $2}' | xargs basename)
            if [ -f "main.go" ]; then
              MAIN="."
            elif [ -d "cmd" ]; then
              MAIN=$(find cmd -name "main.go" -type f | head -1 | xargs dirname 2>/dev/null || echo "cmd/server")
            else
              MAIN="."
            fi
          elif [ -f "Cargo.toml" ]; then
            LANG="rust"
            NAME=$(grep -E '^name\s*=' Cargo.toml | head -1 | sed 's/.*=\s*"\(.*\)".*/\1/')
            MAIN="src/main.rs"
          elif [ -f "package.json" ]; then
            LANG="nodejs"
            NAME=$(jq -r '.name // "app"' package.json)
            NODE_VER=$(jq -r '.engines.node // "20"' package.json | grep -oE '[0-9]+' | head -1)
            echo "node_version=${NODE_VER:-20}" >> $GITHUB_OUTPUT
            MAIN="package.json"
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            LANG="python"
            echo "python_version=3.11" >> $GITHUB_OUTPUT
            NAME=$(basename "${{ github.repository }}")
            for f in main.py app.py run.py src/main.py; do
              [ -f "$f" ] && MAIN="$f" && break
            done
            MAIN=${MAIN:-"main.py"}
          else
            echo "::error::Could not detect project language"
            exit 1
          fi
          
          [ -n "${{ env.PROJECT_NAME }}" ] && NAME="${{ env.PROJECT_NAME }}"
          [ -z "$NAME" ] && NAME=$(basename "${{ github.repository }}")
          [ -n "${{ env.MAIN_FILE }}" ] && MAIN="${{ env.MAIN_FILE }}"
          
          echo "language=$LANG" >> $GITHUB_OUTPUT
          echo "project_name=$NAME" >> $GITHUB_OUTPUT
          echo "main_file=$MAIN" >> $GITHUB_OUTPUT

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="v$(date -u +%Y.%m.%d-%H%M%S)"
          fi
          [[ ! "$VERSION" =~ ^v ]] && VERSION="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION" 2>/dev/null || true
          git push origin "$VERSION" 2>/dev/null || true

  # ============================================================
  # BUILD: Cross-platform builds
  # ============================================================
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    needs: detect
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-latest
            ext: .exe
          - os: windows
            arch: arm64
            runner: windows-latest
            ext: .exe
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            ext: ''
          - os: darwin
            arch: arm64
            runner: macos-latest
            ext: ''
    
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # ===== GO =====
      - name: Setup Go
        if: needs.detect.outputs.language == 'go'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: ${{ needs.detect.outputs.go_version }}
          cache: true

      - name: Build (Go)
        if: needs.detect.outputs.language == 'go'
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p build
          NAME="${{ needs.detect.outputs.project_name }}"
          MAIN="${{ needs.detect.outputs.main_file }}"
          VERSION="${{ needs.detect.outputs.version }}"
          go build -ldflags "-s -w -X 'main.Version=${VERSION}'" \
            -o "build/${NAME}${{ matrix.ext }}" "./${MAIN}"

      # ===== RUST =====
      - name: Setup Rust
        if: needs.detect.outputs.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'windows' && format('{0}-pc-windows-msvc', matrix.arch == 'amd64' && 'x86_64' || 'aarch64') || format('{0}-apple-darwin', matrix.arch == 'amd64' && 'x86_64' || 'aarch64') }}

      - name: Cache Rust
        if: needs.detect.outputs.language == 'rust'
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6

      - name: Build (Rust)
        if: needs.detect.outputs.language == 'rust'
        shell: bash
        run: |
          mkdir -p build
          NAME="${{ needs.detect.outputs.project_name }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            TARGET="${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}-pc-windows-msvc"
          else
            TARGET="${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}-apple-darwin"
          fi
          cargo build --release --target "$TARGET"
          cp "target/$TARGET/release/${NAME}${{ matrix.ext }}" "build/"

      # ===== NODE.JS =====
      - name: Setup Node.js
        if: needs.detect.outputs.language == 'nodejs'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ needs.detect.outputs.node_version }}
          cache: 'npm'

      - name: Build (Node.js)
        if: needs.detect.outputs.language == 'nodejs'
        shell: bash
        run: |
          npm ci
          mkdir -p build
          if grep -q "electron-builder" package.json; then
            [ "${{ matrix.os }}" = "windows" ] && npx electron-builder --win --${{ matrix.arch }}
            [ "${{ matrix.os }}" = "darwin" ] && npx electron-builder --mac --${{ matrix.arch }}
            cp -r dist/* build/ 2>/dev/null || true
          else
            npm run build 2>/dev/null || true
          fi

      # ===== PYTHON =====
      - name: Setup Python
        if: needs.detect.outputs.language == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Build (Python)
        if: needs.detect.outputs.language == 'python'
        shell: bash
        run: |
          pip install pyinstaller
          [ -f requirements.txt ] && pip install -r requirements.txt
          NAME="${{ needs.detect.outputs.project_name }}"
          MAIN="${{ needs.detect.outputs.main_file }}"
          pyinstaller --onefile --name "${NAME}" "$MAIN"
          mkdir -p build
          cp "dist/${NAME}${{ matrix.ext }}" "build/"

      # ===== PACKAGING =====
      - name: Package (Windows)
        if: matrix.os == 'windows'
        id: pkg-win
        shell: pwsh
        run: |
          $NAME = "${{ needs.detect.outputs.project_name }}"
          $VERSION = "${{ needs.detect.outputs.version }}"
          $ARTNAME = "${NAME}-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item build/* release/
          Copy-Item LICENSE*, README*, *.example.* release/ -ErrorAction SilentlyContinue
          Compress-Archive -Path release/* -DestinationPath "${ARTNAME}.zip" -Force
          echo "artifact=${ARTNAME}.zip" >> $env:GITHUB_OUTPUT

      - name: Package (macOS)
        if: matrix.os == 'darwin'
        id: pkg-mac
        shell: bash
        run: |
          NAME="${{ needs.detect.outputs.project_name }}"
          VERSION="${{ needs.detect.outputs.version }}"
          ARTNAME="${NAME}-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          mkdir -p release
          cp build/* release/
          cp LICENSE* README* *.example.* release/ 2>/dev/null || true
          tar -czvf "${ARTNAME}.tar.gz" -C release .
          echo "artifact=${ARTNAME}.tar.gz" >> $GITHUB_OUTPUT

      - name: Create DMG (macOS)
        if: matrix.os == 'darwin'
        id: dmg
        shell: bash
        run: |
          NAME="${{ needs.detect.outputs.project_name }}"
          VERSION="${{ needs.detect.outputs.version }}"
          ARTNAME="${NAME}-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}"
          hdiutil create -volname "${NAME}" -srcfolder release -ov -format UDZO "${ARTNAME}.dmg"
          echo "dmg=${ARTNAME}.dmg" >> $GITHUB_OUTPUT

      # ===== UPLOAD (pinned to SHA) =====
      - name: Upload (Windows)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.pkg-win.outputs.artifact }}
          path: ${{ steps.pkg-win.outputs.artifact }}
          retention-days: 7

      - name: Upload (macOS tar.gz)
        if: matrix.os == 'darwin'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.package-mac.outputs.artifact || steps.pkg-mac.outputs.artifact }}
          path: ${{ steps.pkg-mac.outputs.artifact }}
          retention-days: 7

      - name: Upload (macOS DMG)
        if: matrix.os == 'darwin' && steps.dmg.outputs.dmg != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.dmg.outputs.dmg }}
          path: ${{ steps.dmg.outputs.dmg }}
          retention-days: 7

  # ============================================================
  # RELEASE
  # ============================================================
  release:
    name: Create Release
    needs: [detect, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Prepare files
        id: files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.dmg" \) -exec cp {} release-files/ \;
          ls -la release-files/
          echo "count=$(find release-files -type f | wc -l)" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.files.outputs.count != '0'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda
        with:
          tag_name: ${{ needs.detect.outputs.version }}
          name: Release ${{ needs.detect.outputs.version }}
          body: |
            ## 📥 Downloads
            | Platform | Architecture | Files |
            |----------|--------------|-------|
            | **Windows** | AMD64 / ARM64 | `.zip` |
            | **macOS** | Intel / Apple Silicon (M1/M2/M3) ✅ | `.tar.gz`, `.dmg` |
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
