# 🔄 Auto-Sync Fork & Build Release
# 
# 📋 SYSTEM INFO:
# - Status: ENABLED (Runs automatically every 2 hours)
# - Trigger: Schedule (cron) + Manual (workflow_dispatch)
#
# 🔑 REQUIREMENTS:
# - Secret: PAT_TOKEN (Repository -> Settings -> Secrets -> Actions)
# - Scope: 'repo' and 'workflow' permissions
# 
# ✅ Security Hardened (Pinned Actions)

name: Sync Upstream & Auto Build

on:
  schedule:
    - cron: '0 */2 * * *'  # Run every 2 hours
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no upstream changes'
        type: boolean
        default: false
      create_tag:
        description: 'Tag name (optional)'
        required: false

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: '0xAstroAlpha/cliProxyAPI-Dashboard'
  UPSTREAM_BRANCH: 'main'

jobs:
  sync-fork:
    name: Sync Fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
      new_tag: ${{ steps.tag.outputs.new_tag }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Validate PAT_TOKEN
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "::error::❌ PAT_TOKEN missing! Go to Settings -> Secrets -> Actions and add PAT_TOKEN."
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from Upstream
        id: sync
        run: |
          # Add upstream
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git 2>/dev/null || true
          
          # Fetch
          if ! git fetch upstream ${{ env.UPSTREAM_BRANCH }} --depth=1; then
            echo "::warning::Failed to fetch upstream."
            echo "success=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          UPSTREAM_SHA=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})
          LOCAL_SHA=$(git rev-parse HEAD)
          
          echo "Upstream: $UPSTREAM_SHA"
          echo "Local:    $LOCAL_SHA"
          
          if [ "$UPSTREAM_SHA" != "$LOCAL_SHA" ]; then
            echo "🔄 Updates found! Syncing..."
            git checkout ${{ env.UPSTREAM_BRANCH }} 2>/dev/null || git checkout -b ${{ env.UPSTREAM_BRANCH }}
            git reset --hard upstream/${{ env.UPSTREAM_BRANCH }}
            git push origin ${{ env.UPSTREAM_BRANCH }} --force
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Up to date"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Decision
        id: decide
        run: |
          CHANGES="${{ steps.sync.outputs.has_changes }}"
          FORCE="${{ github.event.inputs.force_build }}"
          
          if [ "$CHANGES" == "true" ] || [ "$FORCE" == "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "🚀 Triggering build..."
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "💤 No build needed."
          fi

      - name: Create Tag
        id: tag
        if: steps.decide.outputs.should_build == 'true'
        run: |
          if [ -n "${{ github.event.inputs.create_tag }}" ]; then
            TAG="${{ github.event.inputs.create_tag }}"
          else
            TAG="v$(date -u +%Y.%m.%d-%H%M%S)"
          fi
          
          echo "📌 Tag: $TAG"
          git tag -a "$TAG" -m "Auto-sync $TAG"
          git push origin "$TAG"
          echo "new_tag=$TAG" >> $GITHUB_OUTPUT

  trigger-build:
    name: Trigger Release
    needs: sync-fork
    if: needs.sync-fork.outputs.should_build == 'true'
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.sync-fork.outputs.new_tag }}
    secrets: inherit
