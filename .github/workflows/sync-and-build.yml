# Auto-sync fork from upstream and build release
name: Sync Upstream & Auto Build

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if no upstream changes'
        type: boolean
        default: false
      create_tag:
        description: 'Tag name for release (leave empty for auto)'
        required: false
        default: ''

permissions:
  contents: write

env:
  UPSTREAM_REPO: '0xAstroAlpha/cliProxyAPI-Dashboard'
  UPSTREAM_BRANCH: 'main'

jobs:
  sync-fork:
    name: Sync Fork from Upstream
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_changes: ${{ steps.sync.outputs.has_changes }}
      new_tag: ${{ steps.tag.outputs.new_tag }}
      should_build: ${{ steps.decide.outputs.should_build }}
    
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Validate PAT_TOKEN
        run: |
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "::error::PAT_TOKEN secret is not set. Please add a Personal Access Token with 'repo' scope."
            exit 1
          fi
          echo "PAT_TOKEN is configured."

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        id: fetch
        run: |
          echo "Adding upstream remote..."
          git remote add upstream https://github.com/${{ env.UPSTREAM_REPO }}.git 2>/dev/null || true
          
          echo "Fetching upstream ${{ env.UPSTREAM_BRANCH }}..."
          if ! git fetch upstream ${{ env.UPSTREAM_BRANCH }} --depth=1; then
            echo "::warning::Failed to fetch upstream. Repository might not exist or is inaccessible."
            echo "fetch_success=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "fetch_success=true" >> $GITHUB_OUTPUT

      - name: Check for changes and sync
        id: sync
        if: steps.fetch.outputs.fetch_success == 'true'
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/${{ env.UPSTREAM_BRANCH }})
          LOCAL_SHA=$(git rev-parse HEAD)
          
          echo "Upstream SHA: $UPSTREAM_SHA"
          echo "Local SHA:    $LOCAL_SHA"
          
          # Handle both schedule (empty) and workflow_dispatch triggers
          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          if [ -z "$FORCE_BUILD" ]; then
            FORCE_BUILD="false"
          fi
          
          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "✅ Fork is up to date with upstream."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            
            if [ "$FORCE_BUILD" = "true" ]; then
              echo "ℹ️ Force build requested, will proceed without sync."
            fi
          else
            echo "🔄 New changes detected! Syncing from upstream..."
            
            # Force reset to upstream
            git checkout ${{ env.UPSTREAM_BRANCH }} 2>/dev/null || git checkout -b ${{ env.UPSTREAM_BRANCH }}
            git reset --hard upstream/${{ env.UPSTREAM_BRANCH }}
            
            # Force push to origin
            git push origin ${{ env.UPSTREAM_BRANCH }} --force
            
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Successfully synced fork with upstream!"
          fi

      - name: Decide if should build
        id: decide
        run: |
          HAS_CHANGES="${{ steps.sync.outputs.has_changes }}"
          FETCH_SUCCESS="${{ steps.fetch.outputs.fetch_success }}"
          
          # Handle empty value from schedule trigger  
          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          if [ -z "$FORCE_BUILD" ]; then
            FORCE_BUILD="false"
          fi
          
          echo "has_changes=$HAS_CHANGES, force_build=$FORCE_BUILD, fetch_success=$FETCH_SUCCESS"
          
          if [ "$FETCH_SUCCESS" != "true" ]; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⚠️ Skipping build due to fetch failure."
          elif [ "$HAS_CHANGES" = "true" ] || [ "$FORCE_BUILD" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "🚀 Will trigger build."
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No build needed."
          fi

      - name: Create new tag
        id: tag
        if: steps.decide.outputs.should_build == 'true'
        run: |
          # Get custom tag or generate auto tag
          CUSTOM_TAG="${{ github.event.inputs.create_tag }}"
          
          if [ -n "$CUSTOM_TAG" ] && [ "$CUSTOM_TAG" != "" ]; then
            NEW_TAG="$CUSTOM_TAG"
          else
            # Auto-generate unique tag based on date+time+seconds
            NEW_TAG="v$(date -u +%Y.%m.%d-%H%M%S)"
          fi
          
          echo "📌 Creating tag: $NEW_TAG"
          
          # Delete existing tag if exists (for reruns with same tag)
          git tag -d "$NEW_TAG" 2>/dev/null || true
          git push origin --delete "$NEW_TAG" 2>/dev/null || true
          
          # Create and push new tag
          git tag -a "$NEW_TAG" -m "Auto-sync from upstream ${{ env.UPSTREAM_REPO }}"
          git push origin "$NEW_TAG"
          
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "✅ Tag $NEW_TAG created and pushed!"

  trigger-build:
    name: Trigger Build Release
    needs: sync-fork
    if: needs.sync-fork.outputs.should_build == 'true' && needs.sync-fork.outputs.new_tag != ''
    uses: ./.github/workflows/release.yaml
    with:
      tag: ${{ needs.sync-fork.outputs.new_tag }}
    secrets: inherit
