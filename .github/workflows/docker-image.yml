# 🐳 Universal Docker Image Build Workflow
# 
# 📋 SETUP INSTRUCTIONS:
# 1. To use DockerHub:
#    - Settings -> Secrets and variables -> Actions -> New repository secret
#    - DOCKERHUB_USERNAME: Your DockerHub ID
#    - DOCKERHUB_TOKEN: Access Token (Read/Write)
# 
# 2. To use GitHub Container Registry (No setup needed!):
#    - Default behavior if DockerHub secrets are missing.
#
# ✅ Security Hardened
# ✅ Auto-detects Registry

name: Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_image:
        description: 'Push image to registry'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ''
  DOCKERHUB_ORG: ''

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check Registry Config
        id: check-secret
        # Securely check if DOCKERHUB_USERNAME is set without exposing it
        run: |
          if [ "${{ secrets.DOCKERHUB_USERNAME }}" != "" ]; then
            echo "has_dockerhub=true" >> $GITHUB_OUTPUT
          else
            echo "has_dockerhub=false" >> $GITHUB_OUTPUT
          fi

      - name: Detect settings
        id: detect
        run: |
          if [ -n "${{ env.IMAGE_NAME }}" ]; then
            NAME="${{ env.IMAGE_NAME }}"
          else
            NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          fi
          
          # Use the result from the secure check step
          if [ "${{ steps.check-secret.outputs.has_dockerhub }}" == "true" ]; then
            ORG="${{ env.DOCKERHUB_ORG }}"
            # If ORG is empty, we can't easily get the username securely here without env context warning.
            # So we assume the user follows the DOCKERHUB_USERNAME format OR set DOCKERHUB_ORG explicitly if different.
            # But wait, if DOCKERHUB_ORG is empty, we wanted to default to username.
            # We can't access secrets.DOCKERHUB_USERNAME here easily safely?
            # Actually, standard practice IS to use secrets in 'env' of a STEP.
            # But let's try to construct the registry name without the secret for now, 
            # Or just use the secret in the next logic block?
            # Let's simplify: stick to logic.
            
            FULL_NAME="docker.io/${NAME}" 
            # Note: This might be incomplete if ORG is needed in image name? 
            # Actually, typically image is user/repo. 
            # If we don't know the user, we can't verify fully. 
            # Let's rely on DOCKERHUB_ORG env var if set, otherwise assume we use secret at push time?
            # No, tag needs full name.
            # Revert to standard env usage for *this specific step* which is safe.
            
            REGISTRY="docker.io"
            echo "auth_type=dockerhub" >> $GITHUB_OUTPUT
          else
            FULL_NAME="ghcr.io/${{ github.repository_owner }}/${NAME}"
            REGISTRY="ghcr.io"
            echo "auth_type=ghcr" >> $GITHUB_OUTPUT
          fi
          
          echo "image_name=$FULL_NAME" >> $GITHUB_OUTPUT
          echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
        env:
           # Pass secret to this step ONLY to allow org detection if safe
           DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
           # But we will use the logic: if DOCKERHUB_USERNAME is set, we use dockerhub.

      - name: Correct Image Name for DockerHub
        if: steps.detect.outputs.auth_type == 'dockerhub'
        run: |
           # Now we can safely construct the name using the secret env var which is available in this step
           ORG="${{ env.DOCKERHUB_ORG }}"
           [ -z "$ORG" ] && ORG="${{ secrets.DOCKERHUB_USERNAME }}"
           NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
           
           echo "image_name=${ORG}/${NAME}" >> $GITHUB_OUTPUT
           # Update the detect output for subsequent steps? No, can't overwrite easily.
           # Better: Set a new output from *this* step to be used later?
           # Or just re-run the logic cleanly.
           
           # Let's try the cleanest approach:
           # We rely on 'steps.detect.outputs.image_name' later.
        
      - name: Finalize Settings
        id: final_settings
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
           # Re-evaluating name mapping safely
           NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
           
           if [ -n "$DOCKER_USER" ]; then
              ORG="${{ env.DOCKERHUB_ORG }}"
              [ -z "$ORG" ] && ORG="$DOCKER_USER"
              FULL_NAME="${ORG}/${NAME}"
              REGISTRY="docker.io"
              TYPE="dockerhub"
           else
              FULL_NAME="ghcr.io/${{ github.repository_owner }}/${NAME}"
              REGISTRY="ghcr.io"
              TYPE="ghcr"
           fi
           
           echo "image_name=$FULL_NAME" >> $GITHUB_OUTPUT
           echo "registry=$REGISTRY" >> $GITHUB_OUTPUT
           echo "auth_type=$TYPE" >> $GITHUB_OUTPUT

      - name: Generate metadata
        id: meta
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Login to DockerHub
        if: steps.final_settings.outputs.auth_type == 'dockerhub'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.final_settings.outputs.auth_type == 'ghcr'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@ca051af179a281898740e0cf0f283c726a33366 # v6.5.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.push_image != 'false' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          tags: |
            ${{ steps.final_settings.outputs.image_name }}:latest
            ${{ steps.final_settings.outputs.image_name }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## 🐳 Image Built" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ steps.final_settings.outputs.registry }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.final_settings.outputs.image_name }}:${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
