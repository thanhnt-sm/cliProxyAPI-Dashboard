# 🧪 Universal PR Test & Build Workflow
# 
# ✅ Security Hardened (Pinned Actions)
# ✅ Auto-detects: Go, Rust, Node.js, Python
# ✅ Runs on Pull Requests

name: PR Test & Build

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  detect:
    name: Detect Project
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      language: ${{ steps.detect.outputs.language }}
      go_version: ${{ steps.detect.outputs.go_version }}
      node_version: ${{ steps.detect.outputs.node_version }}
      python_version: ${{ steps.detect.outputs.python_version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      
      - name: Detect language
        id: detect
        run: |
          if [ -f "go.mod" ]; then
            echo "language=go" >> $GITHUB_OUTPUT
            GO_VER=$(grep -E '^go [0-9]+\.[0-9]+' go.mod | awk '{print $2}')
            echo "go_version=${GO_VER:-1.24}" >> $GITHUB_OUTPUT
          elif [ -f "Cargo.toml" ]; then
            echo "language=rust" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ]; then
            echo "language=nodejs" >> $GITHUB_OUTPUT
            NODE_VER=$(jq -r '.engines.node // "20"' package.json | grep -oE '[0-9]+' | head -1)
            echo "node_version=${NODE_VER:-20}" >> $GITHUB_OUTPUT
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "language=python" >> $GITHUB_OUTPUT
            echo "python_version=3.11" >> $GITHUB_OUTPUT
          else
            echo "language=unknown" >> $GITHUB_OUTPUT
          fi

  test-go:
    name: Test (Go)
    needs: detect
    if: needs.detect.outputs.language == 'go'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: ${{ needs.detect.outputs.go_version }}
          cache: true
      
      - name: Lint
        uses: golangci/golangci-lint-action@971e284b6091e8881d9413a5e0540dd56ded103b # v6.1.1
        with:
          version: latest
        continue-on-error: true
      
      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...
        continue-on-error: true
      
      - name: Build
        run: |
          MAIN=$(find cmd -name "main.go" -type f | head -1 | xargs dirname 2>/dev/null || echo ".")
          go build -o test-binary "./${MAIN}"
          rm -f test-binary
          echo "✅ Build successful"

  test-rust:
    name: Test (Rust)
    needs: detect
    if: needs.detect.outputs.language == 'rust'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Community action, pinning to a recent stable commit for safety
      - uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.7
      
      - name: Format check
        run: cargo fmt --check
        continue-on-error: true
      
      - name: Clippy
        run: cargo clippy -- -D warnings
        continue-on-error: true
      
      - name: Test
        run: cargo test --all
        continue-on-error: true
      
      - name: Build
        run: |
          cargo build --release
          echo "✅ Build successful"

  test-nodejs:
    name: Test (Node.js)
    needs: detect
    if: needs.detect.outputs.language == 'nodejs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.1.0
        with:
          node-version: ${{ needs.detect.outputs.node_version }}
          cache: 'npm'
      
      - name: Install
        run: npm ci
      
      - name: Lint
        run: npm run lint 2>/dev/null || echo "No lint script"
        continue-on-error: true
      
      - name: Test
        run: npm test 2>/dev/null || echo "No test script"
        continue-on-error: true
      
      - name: Build
        run: |
          npm run build 2>/dev/null || echo "No build script"
          echo "✅ Build check complete"

  test-python:
    name: Test (Python)
    needs: detect
    if: needs.detect.outputs.language == 'python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.3.0
        with:
          python-version: ${{ needs.detect.outputs.python_version }}
          cache: 'pip'
      
      - name: Install
        run: |
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest flake8 black 2>/dev/null || true
      
      - name: Lint
        run: |
          flake8 . --count --max-complexity=10 --max-line-length=127 --statistics 2>/dev/null || true
        continue-on-error: true
      
      - name: Format check
        run: black --check . 2>/dev/null || true
        continue-on-error: true
      
      - name: Test
        run: pytest -v 2>/dev/null || echo "No tests found"
        continue-on-error: true
      
      - name: Build check
        run: |
          for f in main.py app.py run.py; do
            [ -f "$f" ] && python -m py_compile "$f" && echo "✅ $f syntax OK"
          done
